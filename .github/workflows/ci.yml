name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/redline-ai

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ── 2. Unit + Integration tests ───────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: redline_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d redline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    env:
      USE_SQLITE: "true"
      SECRET_KEY: test-secret-key-ci
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt pytest pytest-asyncio httpx

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

  # ── 3. Docker build ───────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Load test (smoke — 10 RPS for 30 s) ────────────────────────────────
  load-test:
    name: Load Test (smoke)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Start API (background)
        working-directory: backend
        env:
          USE_SQLITE: "true"
          SECRET_KEY: load-test-secret
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          OTEL_ENABLED: "false"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/api.pid
          sleep 15
          curl -f http://localhost:8000/health

      - name: Obtain JWT token
        id: auth
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8000/api/v1/auth/login \
            -d "username=admin&password=secret" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run smoke load test (10 RPS, 30 s)
        working-directory: backend
        env:
          LOCUST_BEARER_TOKEN: ${{ steps.auth.outputs.token }}
          LOCUST_STAGE_SECONDS: "30"
        run: |
          locust -f locustfile.py \
            --headless \
            --host http://localhost:8000 \
            --users 10 \
            --spawn-rate 5 \
            --run-time 30s \
            --only-summary \
            --exit-code-on-error 0

      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid) || true

  # ── 5. Deploy to staging (main branch only) ───────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: load-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/redline-ai
            docker compose pull app celery_worker
            docker compose up -d --no-deps app celery_worker
            sleep 20
            curl -f http://localhost:8000/ready || exit 1
            echo "Staging deployment OK"
