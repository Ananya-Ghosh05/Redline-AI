<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redline AI - Live Dispatch Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #151820; --border: #1e2233;
      --accent: #e63946; --accent2: #f4a261; --text: #e8eaf0; --muted: #6b7394;
      --crit: #e63946; --high: #f4a261; --med: #ffd166; --low: #2ec4b6;
      --font: 'Inter', system-ui, sans-serif; --radius: 8px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .6; transform: scale(.85); }
    }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
    header h1 span { color: var(--accent); }
    .status-bar { display: flex; align-items: center; gap: 20px; font-size: .78rem; color: var(--muted); }
    .live-badge { display: flex; align-items: center; gap: 6px; color: #2ec4b6; font-weight: 600; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ec4b6; animation: pulse 1.2s infinite; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 32px 0; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .stat-card .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
    .stat-card.crit .value { color: var(--crit); }
    .stat-card.high .value { color: var(--high); }
    .stat-card.ok .value   { color: var(--low); }

    .table-wrap { padding: 24px 32px 40px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      text-align: left; padding: 10px 14px; background: var(--surface);
      border-bottom: 2px solid var(--border); color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em; font-size: .70rem; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:hover { background: #1a1e2a; }
    tbody td { padding: 11px 14px; vertical-align: middle; white-space: nowrap; }
    .call-id { font-family: monospace; color: var(--muted); font-size: .75rem; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .70rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    }
    .badge-critical { background: rgba(230,57,70,.18); color: var(--crit); border: 1px solid rgba(230,57,70,.35); }
    .badge-high     { background: rgba(244,162,97,.18); color: var(--high); border: 1px solid rgba(244,162,97,.35); }
    .badge-medium   { background: rgba(255,209,102,.15); color: var(--med); border: 1px solid rgba(255,209,102,.30); }
    .badge-low      { background: rgba(46,196,182,.12);  color: var(--low); border: 1px solid rgba(46,196,182,.25); }
    .badge-amb   { background: rgba(72,149,239,.15);  color: #4895ef; border: 1px solid rgba(72,149,239,.30); }
    .badge-poly  { background: rgba(114,9,183,.15);   color: #c77dff; border: 1px solid rgba(114,9,183,.30); }
    .badge-fire  { background: rgba(230,57,70,.15);   color: #ff6b6b; border: 1px solid rgba(230,57,70,.30); }
    .badge-other { background: rgba(107,115,148,.12); color: var(--muted); border: 1px solid rgba(107,115,148,.25); }

    .conf    { font-size: .72rem; color: var(--muted); }
    .flag-yes { color: var(--accent); font-size: .72rem; }
    .flag-no  { color: var(--muted); font-size: .72rem; }
    .latency  { color: var(--accent2); font-size: .72rem; }
    .ts { font-size: .70rem; color: var(--muted); }
    .empty { text-align: center; padding: 60px 0; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    footer { text-align: center; font-size: .70rem; color: var(--muted); padding: 12px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <h1><span>REDLINE</span> AI &mdash; Dispatch Console</h1>
  </div>
  <div class="status-bar">
    <div class="live-badge"><div class="live-dot"></div> LIVE</div>
    <span id="last-updated">Updating&hellip;</span>
  </div>
</header>

<div class="stats">
  <div class="stat-card crit"><div class="label">Critical</div><div class="value" id="stat-critical">&mdash;</div></div>
  <div class="stat-card high"><div class="label">High</div><div class="value" id="stat-high">&mdash;</div></div>
  <div class="stat-card ok"><div class="label">Total (last 50)</div><div class="value" id="stat-total">&mdash;</div></div>
  <div class="stat-card ok"><div class="label">ML Fallback %</div><div class="value" id="stat-fallback">&mdash;</div></div>
</div>

<div class="table-wrap">
  <table id="calls-table">
    <thead>
      <tr>
        <th>Call ID</th><th>Time</th><th>Intent</th><th>Confidence</th>
        <th>Emotion</th><th>Severity</th><th>Responder</th>
        <th>Fallback</th><th>Intent FB</th><th>Latency</th>
      </tr>
    </thead>
    <tbody id="calls-body">
      <tr><td colspan="10" class="empty"><div class="empty-icon">&#x1F4E1;</div><div>Waiting for emergency calls&hellip;</div></td></tr>
    </tbody>
  </table>
</div>

<footer>Redline AI Emergency Intelligence Platform &ndash; Refreshes every 2s</footer>

<script>
const RESP_CLS = { ambulance:'badge-amb', fire:'badge-fire', police:'badge-poly' };
const SEV_CLS  = { critical:'badge-critical', high:'badge-high', medium:'badge-medium', low:'badge-low' };

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function renderRow(c) {
  const sevCls = SEV_CLS[c.severity] || 'badge-low';
  const respCls = RESP_CLS[c.responder] || 'badge-other';
  return '<tr>'
    + '<td class="call-id">' + c.call_id + '</td>'
    + '<td class="ts">' + formatTime(c.timestamp) + '</td>'
    + '<td>' + c.intent + '</td>'
    + '<td class="conf">' + (c.intent_confidence * 100).toFixed(1) + '%</td>'
    + '<td>' + c.emotion + '</td>'
    + '<td><span class="badge ' + sevCls + '">' + c.severity + '</span></td>'
    + '<td><span class="badge ' + respCls + '">' + c.responder + '</span></td>'
    + '<td class="' + (c.fallback_used ? 'flag-yes' : 'flag-no') + '">' + (c.fallback_used ? 'YES' : 'no') + '</td>'
    + '<td class="' + (c.intent_fallback ? 'flag-yes' : 'flag-no') + '">' + (c.intent_fallback ? 'YES' : 'no') + '</td>'
    + '<td class="latency">' + c.latency_ms + ' ms</td>'
    + '</tr>';
}

async function refresh() {
  try {
    const res = await fetch('/api/v1/calls/live?limit=50');
    const data = await res.json();
    const calls = data.calls || [];

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    document.getElementById('stat-total').textContent = calls.length;
    document.getElementById('stat-critical').textContent = calls.filter(c => c.severity === 'critical').length;
    document.getElementById('stat-high').textContent = calls.filter(c => c.severity === 'high').length;

    const fb = calls.length ? Math.round(calls.filter(c => c.fallback_used).length / calls.length * 100) : 0;
    document.getElementById('stat-fallback').textContent = fb + '%';

    const tbody = document.getElementById('calls-body');
    if (calls.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty"><div class="empty-icon">&#x1F4E1;</div><div>Waiting for emergency calls&hellip;</div></td></tr>';
    } else {
      tbody.innerHTML = calls.map(renderRow).join('');
    }
  } catch (e) {
    document.getElementById('last-updated').textContent = 'Error: ' + e.message;
  }
}

refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
