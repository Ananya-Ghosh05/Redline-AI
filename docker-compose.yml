version: '3.8'

services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://user:password@postgres/redline
      - SECRET_KEY=dev-secret-change-in-production
      - ML_SERVICE_URL=http://ml_service:8001
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml_service:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    command: uvicorn ml_service.app:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend:/app
      - ./ml:/app/ml

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: redline
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
